name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DEMO_MODE: 'true'
      INTERNAL_AGENT_TOKEN: test-internal-agent-token
      DATABASE_URL: postgresql://proofline:proofline@localhost:5432/proofline?schema=public
      REDIS_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  python-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEMO_MODE: 'true'
      INTERNAL_AGENT_TOKEN: test-internal-agent-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e 'apps/agent[dev]'
      - run: ruff format --check apps/agent
      - run: ruff check apps/agent
      - run: pytest -q apps/agent

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [web-and-api, python-agent]
    strategy:
      matrix:
        component: [web, api, agent]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.component }}/Dockerfile
          push: false
          tags: proofline/${{ matrix.component }}:ci
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
