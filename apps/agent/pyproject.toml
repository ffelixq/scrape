[project]
name = "proofline-agent"
version = "0.1.0"
description = "Evidence-first research orchestration for Proofline"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.13.4",
  "daytona>=0.207.0",
  "fastapi>=0.116.1",
  "google-genai>=1.31.0",
  "httpx>=0.28.1",
  "lxml>=6.0.1",
  "openai>=1.101.0",
  "playwright>=1.55.0",
  "pydantic>=2.11.7",
  "pydantic-settings>=2.10.1",
  "pymupdf>=1.26.4",
  "rapidfuzz>=3.14.0",
  "tldextract>=5.3.0",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.35.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.1",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.11"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
